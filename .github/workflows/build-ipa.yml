name: Build IPA

on:
  push:
    branches:
      - main
      - "design/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build archive
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild archive             -project ThreeOneOSFive.xcodeproj             -scheme 3105             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/3105.xcarchive"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/3105.xcarchive/Products/Applications/3105.app"
          test -d "$APP_PATH"
          echo "Bundled 3105 packages:"
          find "$APP_PATH" -maxdepth 1 -type f -name '*.3105' -print
          test -f "$APP_PATH/HS-CABEZA ATN.3105"
          test -f "$APP_PATH/HS-CUELLO ATN.3105"
          rm -rf build/Payload build/3105-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/3105.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/3105-unsigned.ipa
          test -s build/3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
